name: Release packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - run: npm pack --workspace @kurotch-homelab/agent-skills-cli --workspace @kurotch-homelab/agent-skills-portal --pack-destination .cache --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: .cache/*.tgz
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
  compatibility:
    needs: build
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: .cache
      - run: node scripts/smoke.mjs --packed
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@kurotch-homelab"
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: .cache
      - run: node scripts/release.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
