name: CI
on:
  push:
    branches: [main]
    paths:
      [
        "packages/**",
        "scripts/**",
        "tests/**",
        "package*.json",
        "tsconfig.json",
        ".github/workflows/**",
      ]
  pull_request:
    paths:
      [
        "packages/**",
        "scripts/**",
        "tests/**",
        "package*.json",
        "tsconfig.json",
        ".github/workflows/**",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
